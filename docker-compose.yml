# ============================================================================
# GRC Security Suite - On-Prem / Docker deployment
# ============================================================================
# Brings up PostgreSQL, Ollama (local AI), and the three applications:
#   AutoAudit      -> http://localhost:3001
#   GRC Pulse      -> http://localhost:3002
#   Pentest Pulse  -> http://localhost:3003
#
# The Cloudflare Pages production deployment is unaffected by this file.
#
# Quick start:
#   cp .env.example .env      # then edit secrets
#   docker compose up -d --build
#   docker compose exec ollama ollama pull llama3.1:8b
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: grc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-grc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-grc}
      POSTGRES_DB: ${DB_NAME:-grc_suite}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema + seed are loaded once on first boot, in filename order.
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-grc} -d ${DB_NAME:-grc_suite}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: grc-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    # After first start, pull a model:
    #   docker compose exec ollama ollama pull llama3.1:8b

  autoaudit:
    build:
      context: ./autoaudit
      dockerfile: Dockerfile
    container_name: grc-autoaudit
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_SCHEMA: autoaudit
      DATABASE_URL: postgres://${DB_USER:-grc}:${DB_PASSWORD:-grc}@postgres:5432/${DB_NAME:-grc_suite}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy

  grc-pulse:
    build:
      context: ./grc-pulse
      dockerfile: Dockerfile
      args:
        # Cross-system sync target (Pentest Pulse) on the internal Docker network.
        PENTEST_PULSE_URL: ${PENTEST_PULSE_URL:-http://pentest-pulse:3000}
        # Auth hardening: baked into the bundle at build time so the app's JWT
        # verifier and sync-key check match the server's hardened login. MUST be
        # identical to the runtime values below (and to Pentest Pulse's SYNC_KEY).
        JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
        SYNC_KEY: ${SYNC_KEY:-change-me-in-production}
    container_name: grc-pulse
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_SCHEMA: grc_pulse
      DATABASE_URL: postgres://${DB_USER:-grc}:${DB_PASSWORD:-grc}@postgres:5432/${DB_NAME:-grc_suite}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Hardened login signs sessions with this secret (must equal build arg).
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SYNC_KEY: ${SYNC_KEY:-change-me-in-production}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      # Set to 'true' ONLY for emergency recovery — re-enables CisoHub@2026.
      ALLOW_MASTER_PASSWORD: ${ALLOW_MASTER_PASSWORD:-false}
    ports:
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy

  pentest-pulse:
    build:
      context: ./pentest-pulse
      dockerfile: Dockerfile
      args:
        # Cross-system sync target (GRC Pulse) on the internal Docker network.
        GRC_PULSE_URL: ${GRC_PULSE_URL:-http://grc-pulse:3000}
        # Auth hardening: the inbound sync-key check is baked in at build time.
        # MUST equal GRC Pulse's SYNC_KEY so cross-system sync authenticates.
        SYNC_KEY: ${SYNC_KEY:-change-me-in-production}
    container_name: grc-pentest-pulse
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_SCHEMA: pentest_pulse
      DATABASE_URL: postgres://${DB_USER:-grc}:${DB_PASSWORD:-grc}@postgres:5432/${DB_NAME:-grc_suite}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      EVIDENCE_DIR: /data/evidence
      # Pentest Pulse reads its JWT secret from env natively; the hardened login
      # signs with the same value. SYNC_KEY must match GRC Pulse's.
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SYNC_KEY: ${SYNC_KEY:-change-me-in-production}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      ALLOW_MASTER_PASSWORD: ${ALLOW_MASTER_PASSWORD:-false}
    ports:
      - "3003:3000"
    volumes:
      - pentest_evidence:/data/evidence
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
  pentest_evidence:
